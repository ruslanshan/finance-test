<!DOCTYPE html>
<html lang="ru">
<!-- «Точка Б» – учёт личных финансов. © 2026 Шандриков Руслан Владимирович (Telegram @rushandrikov). Все права защищены. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Личные финансы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --bg2:var(--tg-theme-secondary-bg-color,#efeff4);
  --text:var(--tg-theme-text-color,#15161a);
  --hint:var(--tg-theme-hint-color,#8a8c94);
  --accent:var(--tg-theme-button-color,#2f7cf6);
  --accent-t:var(--tg-theme-button-text-color,#ffffff);
  --sep:rgba(128,128,128,.2);
  --fill:rgba(128,128,128,.13);
  --inc:#1f9d55; --exp:#e0484e; --rev:#7c5cdb; --warn:#d99a12;
}
@media (prefers-color-scheme:dark){:root{
  --bg:var(--tg-theme-bg-color,#1c1c1f);
  --bg2:var(--tg-theme-secondary-bg-color,#000000);
  --text:var(--tg-theme-text-color,#f2f2f5);
  --hint:var(--tg-theme-hint-color,#8d8e96);
  --inc:#34c26f; --exp:#ff6166; --rev:#a48bff;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{padding-top:env(safe-area-inset-top,0px)}
html,body{background:var(--bg2);color:var(--text);font:15px/1.38 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
#view{max-width:640px;margin:0 auto;padding:10px 12px 20px}
.title{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:8px 4px 12px}
.h1{font-size:14px;font-weight:600;color:var(--hint);margin:20px 6px 7px}
.card{background:var(--bg);border-radius:14px;padding:4px 16px;margin-bottom:10px}
.card.pad{padding:14px 16px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--sep);min-height:52px}
.row:last-child{border-bottom:0}
.tap{cursor:pointer}
.ico{width:34px;height:34px;border-radius:9px;background:var(--fill);display:grid;place-items:center;font-size:18px;flex:none}
.grow{flex:1;min-width:0}
.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--hint)}
.r{text-align:right;white-space:nowrap}
.inc{color:var(--inc)}.exp{color:var(--exp)}.rev{color:var(--rev)}
.b{font-weight:600}

/* hero */
.hero{background:var(--bg);border-radius:18px;padding:16px 16px 6px;margin-bottom:10px}
.hero .lbl{font-size:14px;color:var(--hint)}
.hero .net{font-size:34px;font-weight:700;letter-spacing:-.03em;margin:2px 0 4px}
.hero .split{display:flex;gap:18px;font-size:13px;color:var(--hint)}
.hero .split b{color:var(--text);font-weight:600}
.spark{position:relative;height:96px;margin:8px -6px 0}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--bg);border-radius:14px;padding:10px 12px;min-width:0}
.kpi .v{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:7px 2px;border-radius:8px;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--bg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.pnav{display:flex;align-items:center;justify-content:space-between;margin:12px 0 10px;gap:8px}
.pnav .lab{font-weight:600;font-size:16px;text-align:center;flex:1}
.pnav button{width:38px;height:38px;border-radius:50%;border:0;background:var(--bg);color:var(--accent);font-size:22px;line-height:1;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--fill);padding:7px 11px;border-radius:999px;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-t)}
.chip.add{color:var(--accent);font-weight:600}
.scrollx{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.scrollx .chip{flex:none;background:var(--bg)}
.scrollx .chip.on{background:var(--accent)}

.bar{height:5px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chartbox{position:relative;height:210px;margin:10px 0}
.donut{position:relative;height:170px;margin:12px 0 4px}
.donut .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut .dc b{font-size:17px}
.empty{text-align:center;color:var(--hint);padding:26px 10px}
.warn{background:rgba(217,154,18,.15);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.day{display:flex;justify-content:space-between;font-size:13px;color:var(--hint);margin:16px 6px 6px}
.ptable{width:100%;border-collapse:collapse;font-size:14px}
.ptable th{font-weight:500;color:var(--hint);font-size:12px;text-align:right;padding:6px 0 4px}
.ptable th:first-child,.ptable td:first-child{text-align:left}
.ptable td{text-align:right;padding:7px 0;border-top:1px solid var(--sep);white-space:nowrap}
.ptable td+td,.ptable th+th{padding-left:8px}
.link{color:var(--accent);background:none;border:0;padding:12px 0;font-weight:500;display:block;width:100%;text-align:left}
.foot{font-size:12px;color:var(--hint);margin:8px 6px}

/* forms */
.field{margin-bottom:12px}
.field>label{display:block;font-size:13px;color:var(--hint);margin:0 4px 5px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--fill);border:0;border-radius:11px;padding:11px 12px;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--hint) 50%),linear-gradient(135deg,var(--hint) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
select:disabled{opacity:.6}
textarea{min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.amtwrap{display:flex;align-items:center;background:var(--fill);border-radius:11px;padding-right:12px}
.amtwrap input{background:none;font-size:28px;font-weight:700;padding:10px 12px}
.amtwrap span{color:var(--hint);font-weight:600}
.two{display:grid;grid-template-columns:72px 1fr;gap:8px}
.two input:first-child{text-align:center;font-size:20px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;background:var(--accent);color:var(--accent-t);margin-top:6px}
.btn.ghost{background:var(--fill);color:var(--text)}
.btn.danger{background:none;color:var(--exp)}
.inset{background:var(--fill);border-radius:11px;padding:10px 12px;margin-bottom:12px}
.hintline{font-size:13px;color:var(--hint);margin:-6px 4px 12px;min-height:18px}

/* chrome */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--sep);display:flex;padding:5px 4px calc(5px + env(safe-area-inset-bottom,0px));z-index:10}
#tabs button{flex:1;border:0;background:none;color:var(--hint);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
#tabs button.on{color:var(--accent)}
#tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-t);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:11}
#fab.hide{display:none}
#sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#sheet-bg.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:18px 18px 0 0;padding:8px 16px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:21}
#sheet.open{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 12px}
.stitle{font-size:19px;font-weight:700;margin:0 2px 14px}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:rgba(30,30,34,.92);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
/* health & diagnostics */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hdr .title{margin-bottom:12px}
.iconbtn{border:0;background:var(--bg);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--accent);flex:none}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.back{border:0;background:none;color:var(--accent);font-size:16px;padding:10px 4px 0}
.ring{--p:0;--c:var(--accent);width:86px;height:86px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--c) calc(var(--p) * 1%),var(--fill) 0)}
.ring>div{width:68px;height:68px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:25px;font-weight:700;letter-spacing:-.02em}
.scorecard{display:flex;align-items:center;gap:16px}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.good{background:rgba(31,157,85,.15);color:var(--inc)}
.pill.ok{background:rgba(217,154,18,.17);color:var(--warn)}
.pill.bad{background:rgba(224,72,78,.14);color:var(--exp)}
.pill.na{background:var(--fill);color:var(--hint)}
.metric{padding:13px 0;border-bottom:1px solid var(--sep)}
.metric:last-child{border-bottom:0}
.mrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mval{font-size:21px;font-weight:700;letter-spacing:-.02em;text-align:right;white-space:nowrap}
.mhint{font-size:13.5px;margin-top:6px}
.cta{display:flex;align-items:center;gap:12px}
.cta .ico{background:var(--accent);color:var(--accent-t)}
.stage{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px}
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:10px 0 12px}
.ladder i{height:7px;border-radius:4px;background:var(--fill)}
.ladder i.on{background:var(--accent)}
.ladder i.cur{background:var(--accent);height:11px;margin-top:-2px}
.dq{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:22px 2px 6px;line-height:1.25}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{border:0;background:var(--bg);text-align:left;padding:15px 16px;border-radius:14px;font-size:16px;line-height:1.3}
.opt.on{background:var(--accent);color:var(--accent-t)}
.rhead{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.rnum{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-t);display:grid;place-items:center;font-size:14px;flex:none}
.steps{margin:10px 0 0 20px;font-size:14.5px}
.steps li{margin:5px 0;padding-left:2px}
.apphelp{border-left:3px solid var(--accent);background:var(--fill);border-radius:4px 10px 10px 4px;padding:10px 12px;margin-top:12px;font-size:14px}
.apphelp .chip{margin-top:9px;background:var(--accent);color:var(--accent-t)}
.cmp{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;font-size:14px;align-items:baseline}
.cmp .sub{font-size:12px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 4px 12px;cursor:pointer}
.sw span{font-size:15px}.sw small{display:block;font-size:12.5px;color:var(--hint)}
.sw input{-webkit-appearance:none;appearance:none;width:48px;height:29px;border-radius:15px;background:var(--fill);position:relative;flex:none;padding:0;transition:background .2s;cursor:pointer}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw input:checked{background:var(--inc)}
.sw input:checked::after{transform:translateX(19px)}
.badge{font-size:11.5px;font-weight:500;color:var(--hint);background:var(--fill);border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.doc{background:var(--bg);border-radius:14px;padding:16px 18px;font-size:15px;line-height:1.5}
.doc h2{font-size:16px;margin:18px 0 6px}.doc h2:first-child{margin-top:0}
.doc p{margin:6px 0}.doc ul{margin:6px 0 6px 20px}.doc li{margin:4px 0}
@media (prefers-reduced-motion:reduce){#sheet,#sheet-bg,#toast{transition:none}}
</style>
</head>
<body>
<main id="view"></main>
<button id="fab" data-act="fab" aria-label="Добавить операцию">+</button>
<nav id="tabs">
  <button data-act="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg>Обзор</button>
  <button data-act="tab" data-tab="ops"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".6"/><circle cx="4" cy="12" r=".6"/><circle cx="4" cy="18" r=".6"/></svg>Операции</button>
  <button data-act="tab" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M12 3v9h9"/><path d="M20.5 15A9 9 0 1 1 9 3.5"/></svg>Статистика</button>
  <button data-act="tab" data-tab="plan"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/></svg>План</button>
  <button data-act="tab" data-tab="health"><svg viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"/></svg>Здоровье</button>
</nav>
<div id="sheet-bg" data-act="sheet-bg"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast"></div>
<script>

'use strict';
/*
 * «Точка Б» – учёт личных финансов (Telegram Mini App)
 * © 2026 Шандриков Руслан Владимирович (Telegram @rushandrikov). Все права защищены.
 * Копирование, изменение и распространение кода без письменного разрешения автора запрещены.
 */
const APP_VERSION = '1.7.4 · 22.09.2026';
// Тестовый режим: включается флагом в тестовой сборке ИЛИ автоматически, если адрес страницы
// содержит «test» (например .../finance-test/). Вторая проверка страхует от случая, когда
// в тестовый репозиторий по ошибке загрузили рабочий файл: данные всё равно останутся раздельными.
const PAGE_URL = location.host + location.pathname;
const TEST_MODE = true;
// ▼▼▼ Автор и контакт – показываются в разделе «О приложении» и в политике конфиденциальности ▼▼▼
const AUTHOR_NAME = 'Шандриков Руслан Владимирович';
const AUTHOR_CONTACT = 'Telegram @rushandrikov';
const POLICY_DATE = '22 сентября 2026 г.';
// ▼▼▼ Адрес сервера семейного бюджета (Cloudflare Worker). Пусто – семейный режим выключен. ▼▼▼
const FAMILY_API = ''; // ← сюда адрес ТЕСТОВОГО воркера, например https://tochka-b-api-test.rolionxxx.workers.dev
/* ================= Telegram ================= */
const tg = window.Telegram && window.Telegram.WebApp;
const TGV = v => { try { return !!(tg && tg.initData && tg.isVersionAtLeast(v)); } catch (e) { return false; } };
if (tg) { try { tg.ready(); tg.expand(); if (TGV('7.7')) tg.disableVerticalSwipes(); if (TGV('6.1')) { tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); } } catch (e) {} }
const haptic = k => { try { if (!TGV('6.1')) return; if (k === 'ok') tg.HapticFeedback.notificationOccurred('success'); else tg.HapticFeedback.selectionChanged(); } catch (e) {} };
const ask = msg => new Promise(res => { if (TGV('6.2')) tg.showConfirm(msg, ok => res(!!ok)); else res(window.confirm(msg)); });

/* ================= Справочники ================= */
// код: [название, символ, знаков после запятой]
const CUR = {
  USD:['Доллар США','$',2], EUR:['Евро','€',2], BYN:['Белорусский рубль','Br',2], RUB:['Российский рубль','₽',2],
  UAH:['Гривна','₴',2], KZT:['Тенге','₸',2], PLN:['Злотый','zł',2], GBP:['Фунт стерлингов','£',2],
  CNY:['Юань','CN¥',2], TRY:['Турецкая лира','₺',2], GEL:['Лари','₾',2], AMD:['Драм','֏',2],
  UZS:['Сум','UZS',0], AED:['Дирхам ОАЭ','AED',2], THB:['Бат','฿',2], JPY:['Иена','JP¥',0],
  CHF:['Швейцарский франк','CHF',2], CAD:['Канадский доллар','C$',2], CZK:['Чешская крона','Kč',2],
  BTC:['Bitcoin','BTC',8], ETH:['Ethereum','ETH',6], USDT:['Tether','USDT',2], TON:['Toncoin','TON',4],
  SOL:['Solana','SOL',4], XAU:['Золото (унция)','XAU',4]
};
const CODES = Object.keys(CUR);
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MON_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MON_S = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WDL = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const PAL = ['#3b82f6','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16','#06b6d4','#a855f7','#eab308','#64748b','#0ea5e9','#d946ef'];

/* ================= Утилиты ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); };
const fmtDate = s => { const d = parseD(s); return d.getDate() + ' ' + MON_G[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); };
const fmtShort = s => { const d = parseD(s); return d.getDate() + ' ' + MON_S[d.getMonth()]; };
const round = (v, d = 8) => Math.round(v * Math.pow(10, d)) / Math.pow(10, d);

function fmt(v, cur, sign) {
  if (v == null || !isFinite(v)) return '–';

// Внутреннее «значение» счёта: актив = +остаток, обязательство = −долг. Капитал = сумма значений.
let SORTED = [];
const sgn = a => a && a.type === 'liab' ? -1 : 1;

  switch (t.t) {
    case 'inc': if (t.a in val) val[t.a] += t.amt; break;
    case 'exp': if (t.a in val) val[t.a] -= t.amt; break;
    case 'tr': if (t.a in val) val[t.a] -= t.amt; if (t.a2 in val) val[t.a2] += t.amt2; break;
    case 'rev': case 'bal': {

}

  SORTED = S.tx.slice().sort((x, y) => x.d < y.d ? -1 : x.d > y.d ? 1 : (x.ts || 0) - (y.ts || 0));

/* ================= Курсы валют ================= */
// Источник: github.com/fawazahmed0/exchange-api – бесплатно, без ключа, ежедневные исторические курсы (с 2024-03-02)
const EARLIEST = '2024-03-02';
let R = {}; try { R = JSON.parse(localStorage.getItem(RKEY)) || {}; } catch (e) {}
let RK = Object.keys(R).sort();
const FAILED = new Set();

let MISSING = false;

  `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${tag}/v1/currencies/usd.min.json`,
  `https://${tag}.currency-api.pages.dev/v1/currencies/usd.min.json`

async function fetchJSON(u) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), 9000);
  try { const r = await fetch(u, { signal: c.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}

  for (const u of rateUrls(tag)) {
    try {
      const j = await fetchJSON(u);
      if (j && j.usd) { const r = { USD: 1 }; CODES.forEach(c => { const v = j.usd[c.toLowerCase()]; if (v) r[c] = v; }); return { date: j.date || tag, r }; }
    } catch (e) {}
  }

}

  const res = await fetchRates('latest');
  RS.loading = false;
  if (res) { putRates(res.date, res.r); if (res.date !== today()) putRates(today(), res.r); saveRates(); RS.latest = res.date; RS.error = false; }

  const need = [...new Set(dates)].filter(d => d >= EARLIEST && d < t && !R[d] && !FAILED.has(d));
  if (!need.length) return false;
  for (let i = 0; i < need.length; i += 6) {
    await Promise.all(need.slice(i, i + 6).map(async d => { const res = await fetchRates(d); if (res) putRates(d, res.r); else FAILED.add(d); }));

function probe(v) { const el = document.createElement('i'); el.style.color = 'var(' + v + ')'; document.body.appendChild(el); const c = getComputedStyle(el).color; el.remove(); return c; }

let COL = {};
function themeColors() {

  if (window.Chart) { Chart.defaults.color = COL.hint; Chart.defaults.borderColor = 'rgba(128,128,128,.14)'; Chart.defaults.font.family = getComputedStyle(document.body).fontFamily; Chart.defaults.font.size = 11; }
}
function destroyCharts() { for (const k in charts) { try { charts[k].destroy(); } catch (e) {} delete charts[k]; } }
function mountCharts() { if (!window.Chart) return; PEND.forEach(([id, cfg]) => { const el = document.getElementById(id); if (el) charts[id] = new Chart(el, cfg); }); }

const seg = (act, items, cur) => `<div class="seg">${items.map(([k, l]) => `<button data-act="${act}" data-k="${k}" class="${k === cur ? 'on' : ''}">${l}</button>`).join('')}</div>`;
const pnav = (act, label) => `<div class="pnav"><button data-act="${act}" data-dir="-1" aria-label="Назад">‹</button><div class="lab">${label}</div><button data-act="${act}" data-dir="1" aria-label="Вперёд">›</button></div>`;
function kpis(f) {

}

/* ---------- Операции ---------- */
function txView(t) {
  const a = accById(t.a), cur = a ? a.cur : B(), an = a ? a.name : t.sh ? 'Личный счёт · ' + memberName(t.by) : 'Удалённый счёт';
  switch (t.t) {
    case 'inc': case 'exp': { const c = catById(t.c); return { icon: c ? c.icon : '❔', title: c ? c.name : 'Без статьи', sub: an, amt: fmt(t.t === 'inc' ? t.amt : -t.amt, cur, true), cls: t.t }; }
    case 'tr': { const b = accById(t.a2); return { icon: '🔁', title: 'Перевод', sub: an + ' → ' + (b ? b.name : t.sh ? 'личный счёт · ' + memberName(t.by) : '?'), amt: !a && b ? fmt(t.amt2, b.cur) : fmt(t.amt, cur) + (b && a && b.cur !== cur ? ' → ' + fmt(t.amt2, b.cur) : ''), cls: '' }; }
    case 'rev': return { icon: '📈', title: 'Переоценка', sub: an + ': ' + fmt(t.nb, cur), amt: fmt(t._delta, cur, true), cls: 'rev' };
    case 'bal': return { icon: '⚖️', title: 'Остаток', sub: an + ': ' + fmt(t.nb, cur), amt: fmt(t._delta, cur, true), cls: 'rev' };
  }
  return { icon: '•', title: '?', sub: '', amt: '', cls: '' };
}
const txRow = t => { const v = txView(t); return `<div class="row tap" data-act="tx-open" data-id="${t.id}"><div class="ico">${esc(v.icon)}</div><div class="grow"><div class="t">${esc(v.title)}</div><div class="sub t">${esc(v.sub)}${t.n ? ' · ' + esc(t.n) : ''}${t.sh && t.by && t.by !== myId() ? ' · 👤 ' + esc(memberName(t.by)) : ''}</div></div><div class="r num ${v.cls}">${v.amt}</div></div>`; };
V.ops = {
  need() { return []; },
  draw() {
    const [y, m] = UI.opsMonth.split('-').map(Number), from = iso(new Date(y, m - 1, 1)), to = iso(new Date(y, m, 0));
    const F = UI.opsFilter;
    const list = SORTED.filter(t => t.d >= from && t.d <= to && (F === 'all' || t.t === F || (F === 'rev' && t.t === 'bal'))).reverse();
    const filters = [['all', 'Все'], ['exp', 'Расходы'], ['inc', 'Доходы'], ['tr', 'Переводы'], ['rev', 'Переоценка и остатки']];
    let html = `<div class="title">Операции</div>${pnav('ops-nav', MONTHS[m - 1] + ' ' + y)}
      <div class="scrollx">${filters.map(([k, l]) => `<button class="chip ${k === F ? 'on' : ''}" data-act="ops-filter" data-k="${k}">${l}</button>`).join('')}</div>`;
    if (!list.length) return html + `<div class="card empty">За этот месяц операций нет.<br>Нажмите «+», чтобы добавить.</div>`;
    let day = null, buf = [];
    const flush = () => { if (!buf.length) return; html += `<div class="day"><span>${fmtDate(day)}</span></div><div class="card">${buf.join('')}</div>`; buf = []; };
    for (const t of list) { if (t.d !== day) { flush(); day = t.d; } buf.push(txRow(t)); }
    flush(); return html;
  }
};

/* ---------- Статистика ---------- */
function breakdown(id, title, map, total, kind) {
  const items = Object.entries(map).filter(e => e[1] > 0).sort((a, b) => b[1] - a[1]);
  if (!items.length) return `<div class="h1">${title}</div><div class="card empty">Нет данных за период</div>`;
  PEND.push([id, { type: 'doughnut', data: { labels: items.map(([c]) => (catById(c) || { name: 'Без статьи' }).name), datasets: [{ data: items.map(e => e[1]), backgroundColor: items.map(([c]) => catColor(c)), borderWidth: 0 }] },
    options: { maintainAspectRatio: false, cutout: '70%', animation: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ' ' + fmt(c.parsed, B()) } } } } }]);
  return `<div class="h1">${title}</div><div class="card pad">
    <div class="donut"><canvas id="${id}"></canvas><div class="dc"><span class="sub">Всего</span><b class="num">${fmt(total, B())}</b></div></div>
    ${items.map(([c, v]) => { const cat = catById(c), p = total ? v / total * 100 : 0; return `<div class="row"><span class="dot" style="background:${catColor(c)}"></span>
      <div class="grow"><div class="t">${esc(cat ? cat.icon + ' ' + cat.name : 'Без статьи')}</div><div class="bar"><i style="width:${p.toFixed(1)}%;background:${catColor(c)}"></i></div></div>
      <div class="r"><div class="num ${kind}">${fmt(v, B())}</div><div class="sub num">${p.toFixed(1).replace('.', ',')}%</div></div></div>`; }).join('')}</div>`;
}

        { type: 'line', label: 'Поток', data: bf.map(x => x.inc - x.exp), borderColor: COL.accent, backgroundColor: COL.accent, pointRadius: 2, borderWidth: 2, tension: .3, order: 1 }] },
        options: { maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10 } }, tooltip: { callbacks: { label: c => ' ' + c.dataset.label + ': ' + fmt(c.parsed.y, B()) } } },
          scales: { x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkipPadding: 6 } }, y: { ticks: { callback: v => fmtCompact(v), maxTicksLimit: 5 } } } } }]);
      html += `<div class="h1">Денежный поток: доходы − расходы</div><div class="card pad"><div class="chartbox"><canvas id="flowChart"></canvas></div></div>`;

/* ---------- План ---------- */
V.plan = {
  need() { const r = range(UI.planKind, UI.planAnchor); return txDates(r.from, r.to, []); },
  draw() {
    const r = range(UI.planKind, UI.planAnchor), f = flows(r.from, r.to), months = monthsIn(r.from, r.to), isM = UI.planKind === 'month';
    const pv = cid => months.reduce((s, mk) => s + planVal(mk, cid), 0);
    const hasPlan = cid => months.some(mk => S.plans[mk] && S.plans[mk][cid]);
    const sect = kind => {
      const fact = kind === 'inc' ? f.byInc : f.byExp;
      const cats = S.cats.filter(c => c.kind === kind && (!c.del || hasPlan(c.id) || fact[c.id]));
      let tp = 0;
      const rows = cats.map(c => {
        const p = pv(c.id), fa = fact[c.id] || 0; tp += p;
        if (!p && !fa && !isM) return '';
        const pct = p > 0 ? fa / p : 0;
        let color = COL.accent, note;
        if (!p) { note = fa ? 'вне плана' : 'план не задан'; color = COL.hint; }
        else if (kind === 'exp') { color = pct > 1 ? COL.exp : pct > .85 ? 'var(--warn)' : COL.accent; note = pct > 1 ? 'перерасход ' + fmt(fa - p, B()) : 'осталось ' + fmt(p - fa, B()); }
        else { color = pct >= 1 ? COL.inc : COL.accent; note = pct >= 1 ? 'сверх плана ' + fmt(fa - p, B()) : 'до плана ' + fmt(p - fa, B()); }
        return `<div class="row ${isM ? 'tap' : ''}" ${isM ? `data-act="pl-edit" data-id="${c.id}"` : ''}><div class="ico">${esc(c.icon || '•')}</div>
          <div class="grow"><div class="t">${esc(c.name)}</div><div class="bar"><i style="width:${Math.min(100, pct * 100).toFixed(1)}%;background:${color}"></i></div><div class="sub">${note}</div></div>
          <div class="r num"><div>${fmt(fa, B())}</div><div class="sub">из ${p ? fmt(p, B()) : '–'}</div></div></div>`;
      }).join('');
      return { rows, tp };
    };
    const e = sect('exp'), i = sect('inc');
    const d = (p, a, good) => { const x = a - p; return `<td class="num ${x === 0 ? '' : (good ? x > 0 : x < 0) ? 'inc' : 'exp'}">${fmt(x, B(), true)}</td>`; };
    let html = `<div class="title">План и факт</div>${seg('plan-kind', [['month', 'Месяц'], ['year', 'Год']], UI.planKind)}${pnav('plan-nav', r.label)}
      <div class="card pad"><table class="ptable"><tr><th></th><th>План</th><th>Факт</th><th>Разница</th></tr>
        <tr><td>Доходы</td><td class="num">${fmt(i.tp, B())}</td><td class="num">${fmt(f.inc, B())}</td>${d(i.tp, f.inc, true)}</tr>
        <tr><td>Расходы</td><td class="num">${fmt(e.tp, B())}</td><td class="num">${fmt(f.exp, B())}</td>${d(e.tp, f.exp, false)}</tr>
        <tr><td class="b">Поток</td><td class="num b">${fmt(i.tp - e.tp, B(), true)}</td><td class="num b">${fmt(f.inc - f.exp, B(), true)}</td>${d(i.tp - e.tp, f.inc - f.exp, true)}</tr></table></div>`;
    html += `<div class="h1">Расходы</div><div class="card">${e.rows || '<div class="empty">Нет данных</div>'}</div>`;
    html += `<div class="h1">Доходы</div><div class="card">${i.rows || '<div class="empty">Нет данных</div>'}</div>`;
    html += isM ? `<button class="btn ghost" data-act="pl-copy">Скопировать план из прошлого месяца</button><div class="foot">Нажмите на статью, чтобы задать план на месяц.</div>`
                : `<div class="foot">Годовой план – сумма месячных планов. Задавать суммы можно в режиме «Месяц».</div>`;
    return html;
  }
};

// Чинит текст, испорченный при пересылке через Telegram: разбивка на несколько сообщений,
// заголовки «Имя, [22.09.2026 15:40]», переносы строк, «умные» кавычки.
function parseBackup(raw) {
  const clean = t => {
    t = t.replace(/\u00A0/g, ' ').replace(/[\u200B-\u200D\uFEFF]/g, '');
    t = t.split(/\r?\n/).filter(l => !/^\s*[^{}"]{1,80},?\s*\[\d{1,2}[./]\d{1,2}[./]\d{2,4}[^\]]*\]:?\s*$/.test(l)).join('');
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    return a < 0 || b < a ? '' : t.slice(a, b + 1);
  };
  const body = clean(String(raw || ''));
  if (!body) return { err: 'В тексте нет данных экспорта' };
  try { return { d: JSON.parse(body) }; } catch (e) {}
  // Вторая попытка – если кавычки превратились в «умные»
  try { return { d: JSON.parse(body.replace(/[\u201C\u201D\u201E\u2033]/g, '"')) }; } catch (e) {}
  if (!/^\{"v":/.test(body)) return { err: 'Нет начала экспорта – скопируйте текст целиком, с первого символа {' };
  if (!/"diagHist"|"plans"/.test(body.slice(-2000))) return { err: 'Нет конца экспорта – похоже, скопирована только часть текста' };
  return { err: 'Текст повреждён. Если Telegram разбил его на несколько сообщений, выделите их все и скопируйте вместе' };
}
async function doImport() {
  const r = parseBackup($('#impdata').value);
  if (r.err) return toast(r.err);
  const d = r.d;
  if (!d || !Array.isArray(d.accounts) || !Array.isArray(d.tx)) return toast('Это не экспорт этого приложения');
  if (!(await ask(`В копии: счетов ${d.accounts.length}, операций ${d.tx.length}. Сейчас в приложении операций ${S.tx.length}. Заменить текущие данные копией?`))) return;
  S = normalize(d); S.onb = true; persist(); closeSheet(true); toast('Данные загружены'); render();
}

}

// Общие счета хранятся на сервере семьи (Cloudflare Worker, адрес – FAMILY_API в начале файла).
// Личные счета и операции по ним на сервер не отправляются.
const FAM = { err: '', busy: false, loading: false };
const myId = () => { try { return (tg.initDataUnsafe.user || {}).id || 0; } catch (e) { return 0; } };
const myName = () => { try { const u = tg.initDataUnsafe.user; return [u.first_name, u.last_name].filter(Boolean).join(' ') || 'Участник'; } catch (e) { return 'Участник'; } };
const famAvail = () => !!(FAMILY_API && tg && tg.initData);
const inFam = () => !!(S.fam && S.fam.hid);
const famReady = () => famAvail() && inFam();
const memberName = uid => { if (uid && uid === myId()) return 'вы'; const m = S.fam && (S.fam.members || []).find(x => x.uid === uid); return m ? m.name : 'участник семьи'; };
const sharedSet = () => new Set(S.accounts.filter(a => a.sh).map(a => a.id));
const touchesShared = t => { const sh = sharedSet(); return sh.has(t.a) || !!(t.a2 && sh.has(t.a2)); };
const famBadge = a => a.sh ? ` <span class="badge">👥 общий${a.owner && a.owner !== myId() ? ' · ' + esc(memberName(a.owner)) : ''}</span>` : '';
const FAM_ERR = { auth: 'Telegram не подтвердил вход – перезапустите приложение', already_member: 'Вы уже состоите в семье', bad_code: 'Код не найден или истёк', not_member: 'Вы больше не участник семьи', server_not_configured: 'Сервер не настроен: проверьте BOT_TOKEN и базу D1', 'Failed to fetch': 'нет связи с сервером' };
const famErrText = e => FAM_ERR[e] || e;

async function api(path, body) {
  const c = new AbortController(), tm = setTimeout(() => c.abort(), 15000);
  try {
    const r = await fetch(FAMILY_API.replace(/\/+$/, '') + path, { method: 'POST', signal: c.signal, headers: { 'Content-Type': 'application/json', 'X-Init-Data': tg.initData }, body: JSON.stringify(body || {}) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.error) throw new Error(j.error || 'HTTP ' + r.status);
    return j;
  } catch (e) { throw new Error(e.name === 'AbortError' ? 'Failed to fetch' : e.message); }
  finally { clearTimeout(tm); }
}

/* ---- Очередь изменений ---- */
let famSoonT;
function famSoon() { clearTimeout(famSoonT); famSoonT = setTimeout(famSync, 700); }
function famQueue(op) { if (!inFam()) return; (S.outbox = S.outbox || []).push(op); famSoon(); }
function txOut(t) {
  const sh = sharedSet();
  const o = { id: t.id, t: t.t, d: t.d, ts: t.ts, by: t.by || myId(), a: sh.has(t.a) ? t.a : '' };
  if (t.a2) o.a2 = sh.has(t.a2) ? t.a2 : '';
  ['amt', 'amt2', 'nb', 'n'].forEach(k => { if (t[k] != null) o[k] = t[k]; });
  if (t.c) { o.c = t.c; const c = catById(t.c); if (c) o.cat = { name: c.name, icon: c.icon, kind: c.kind, must: !!c.must, debt: !!c.debt, passive: !!c.passive }; }
  return o;
}
const accOut = a => ({ id: a.id, name: a.name, icon: a.icon, type: a.type, cur: a.cur, init: a.init, liquid: !!a.liquid });
function famAfterTx(t, prev) {
  if (!inFam()) return;
  if (touchesShared(t)) { t.sh = 1; t.by = (prev && prev.by) || myId(); famQueue({ k: 'tx', tx: txOut(t) }); }
  else if (prev && prev.sh) { delete t.sh; famQueue({ k: 'txdel', id: t.id }); }
}
function famAfterDel(t) { if (inFam() && t.sh) famQueue({ k: 'txdel', id: t.id }); }
function famAfterAcc(a, wantShare) {
  if (!inFam() || (a.sh && a.owner && a.owner !== myId())) return;
  if (wantShare) {
    const first = !a.sh; a.sh = S.fam.hid; a.owner = myId();
    famQueue({ k: 'acc', acc: accOut(a) });
    if (first) S.tx.forEach(t => { if (t.a === a.id || t.a2 === a.id) { t.sh = 1; t.by = t.by || myId(); famQueue({ k: 'tx', tx: txOut(t) }); } });
  } else if (a.sh) {
    famQueue({ k: 'accdel', id: a.id }); delete a.sh; delete a.owner;
    S.tx.forEach(t => { if ((t.a === a.id || t.a2 === a.id) && t.sh) { if (touchesShared(t)) famQueue({ k: 'tx', tx: txOut(t) }); else delete t.sh; } });
  }
}

/* ---- Приём изменений от семьи ---- */
function localCat(remoteId, snap) {
  if (catById(remoteId)) return remoteId;
  if (!snap) return remoteId;
  const nm = String(snap.name || '').trim().toLowerCase();
  const same = S.cats.find(c => c.kind === snap.kind && c.name.trim().toLowerCase() === nm);
  if (same) { if (same.del) delete same.del; return same.id; }
  S.cats.push({ id: remoteId, name: snap.name || 'Статья', icon: snap.icon || '', kind: snap.kind, must: !!snap.must, debt: !!snap.debt, passive: !!snap.passive });
  return remoteId;
}
function removeSharedAccount(id) {
  S.accounts = S.accounts.filter(a => a.id !== id);
  S.tx = S.tx.filter(t => { if (t.a !== id && t.a2 !== id) return true; const other = t.a === id ? t.a2 : t.a; return !!(other && accById(other)); });
}
function famMerge(r) {
  let ch = false;
  const my = myId();
  const mem = JSON.stringify(r.members || []);
  if (mem !== JSON.stringify(S.fam.members || [])) { S.fam.members = r.members || []; ch = true; }
  S.fam.since = r.now;
  for (const x of r.accounts || []) {
    const loc = accById(x.id);
    if (x.del) {
      if (!loc || !loc.sh) continue;
      if (x.owner === my) { delete loc.sh; delete loc.owner; } else removeSharedAccount(x.id);
      ch = true; continue;
    }
    let d; try { d = JSON.parse(x.data); } catch (e) { continue; }
    if (loc) {
      if (x.owner !== my) Object.assign(loc, { name: d.name, icon: d.icon, type: d.type, cur: d.cur, init: d.init });
      if (loc.sh !== r.hid || loc.owner !== x.owner) { loc.sh = r.hid; loc.owner = x.owner; }
    } else S.accounts.push({ id: x.id, name: d.name, icon: d.icon, type: d.type, cur: d.cur, init: d.init, liquid: !!d.liquid, sh: r.hid, owner: x.owner });
    ch = true;
  }
  for (const x of r.tx || []) {
    const i = S.tx.findIndex(t => t.id === x.id);
    if (x.del) {
      if (i < 0) continue;
      const loc = S.tx[i], mine = [loc.a, loc.a2].some(id => { const ac = id && accById(id); return ac && !ac.sh; });
      if (mine) { if (loc.sh) { delete loc.sh; ch = true; } } else { S.tx.splice(i, 1); ch = true; }
      continue;
    }
    let d; try { d = JSON.parse(x.data); } catch (e) { continue; }
    const loc = i >= 0 ? S.tx[i] : null;
    const t = Object.assign({}, d, { sh: 1 }); delete t.cat;
    if (loc) { if (!t.a && loc.a) t.a = loc.a; if (t.a2 === '' && loc.a2) t.a2 = loc.a2; } // свои личные счета не теряем
    if (!accById(t.a) && !(t.a2 && accById(t.a2))) { if (i >= 0) { S.tx.splice(i, 1); ch = true; } continue; } // счёт больше не общий
    if (d.c) t.c = localCat(d.c, d.cat);
    if (loc && JSON.stringify(loc) === JSON.stringify(t)) continue;
    if (i >= 0) S.tx[i] = t; else S.tx.push(t);
    ch = true;
  }
  return ch;
}
function famDropLocal() {
  const my = myId();
  S.accounts.filter(a => a.sh && a.owner !== my).map(a => a.id).forEach(removeSharedAccount);
  S.accounts.forEach(a => { delete a.sh; delete a.owner; });
  S.tx.forEach(t => { delete t.sh; });
  S.fam = null; S.outbox = [];
}
async function famSync() {
  if (!famReady() || FAM.busy) return;
  FAM.busy = true;
  let changed = false, sent = 0;
  const hadErr = FAM.err;
  try {
    for (let loop = 0; loop < 40; loop++) {
      const ops = (S.outbox || []).slice(0, 30);
      const r = await api('/sync', { since: S.fam.since || 0, ops });
      S.outbox.splice(0, ops.length); sent += ops.length;
      if (famMerge(r)) changed = true;
      if (!S.outbox.length) break;
    }
    FAM.err = '';
  } catch (e) {
    FAM.err = e.message;
    if (e.message === 'not_member') { famDropLocal(); changed = true; toast('Вы больше не участник семьи – общие счета скрыты'); }
  } finally { FAM.busy = false; }
  if (changed || sent) persist();
  if (changed || hadErr !== FAM.err) { if (UI.tab !== 'diag') draw(); }
}

/* ================= Политика конфиденциальности и авторство ================= */
const policyHtml = () => `<h2>1. Кто мы</h2>

<h2>2. Какие данные обрабатываются</h2>
<ul>

<h2>3. Где хранятся данные</h2>
<ul>

<li><b>На сервере семейного бюджета (Cloudflare)</b> – только если вы вступили в семью: общие семейные счета и операции по ним, идентификаторы и имена участников семьи. Личные счета и операции по ним на сервер не передаются. При переводе между личным и общим счётом на сервер попадают только сумма и сторона общего счёта – название и остаток личного счёта не передаются.</li>
<li><b>На GitHub</b> хранится только программный код приложения, ваших данных там нет.</li>
</ul>
<p>Курсы валют загружаются из открытого источника через сети jsDelivr и Cloudflare. При этом передаётся только дата, никаких ваших данных.</p>
<h2>4. Для чего используются данные</h2>
<p>Только для работы приложения: учёта, расчёта статистики, капитала, плана, метрик финансового здоровья и рекомендаций, синхронизации между вашими устройствами и ведения общего семейного бюджета. Данные не используются для рекламы и профилирования и не продаются.</p>
<h2>5. Кто имеет доступ</h2>

<li>Секретный ключ бота хранится только на сервере и не содержится в коде приложения.</li>

<p>Ни один способ хранения не даёт абсолютной защиты. Рекомендуем включить код-пароль в Telegram и время от времени делать резервную копию (Настройки → Данные → Экспорт в JSON).</p>
<h2>8. Сроки хранения и удаление</h2>
<ul>
<li>Данные на устройстве и в облаке Telegram хранятся, пока вы их не удалите. Кнопка «Удалить все данные» в настройках очищает данные на устройстве, в облаке Telegram и резервную копию, а если вы состоите в семье – выводит вас из неё.</li>
<li>При выходе из семьи ваши общие счета перестают быть общими, их данные и операции по ним удаляются с сервера. Когда семью покидает последний участник, все данные семьи удаляются с сервера полностью.</li>
<li>Содержимое удалённых операций и счетов стирается с сервера сразу. В базе остаётся только служебная отметка без содержимого – она нужна, чтобы удаление дошло до устройств других участников.</li>
<li>В резервных копиях базы данных Cloudflare удалённые данные могут храниться до 30 дней, после чего удаляются автоматически.</li>
<li>Вы можете в любой момент написать автору и попросить удалить ваши данные с сервера.</li>
</ul>
<h2>9. Ваши права</h2>
<p>Вы можете получить свои данные (экспорт в JSON), исправить их в приложении, удалить их, отозвать согласие на обработку – прекратить использование приложения и удалить данные, а также обратиться к автору с вопросом или жалобой либо в уполномоченный орган по защите персональных данных своей страны.</p>
<h2>10. Возрастные ограничения</h2>
<p>Приложение не предназначено для лиц младше 16 лет.</p>
<h2>11. Изменения политики</h2>
